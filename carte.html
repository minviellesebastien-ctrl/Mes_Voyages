<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mes Voyages</title>
  
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
  
  <style>
    body, html { 
      margin: 0; padding: 0; height: 100%; width: 100%; 
      background-image: url('fond-map.png'); 
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      overflow: hidden;
    }

    #map { width: 100%; height: 100vh; background: transparent; }

    /* Points des villes : petits et blancs */
    .custom-marker {
      width: 6px;
      height: 6px;
      background-color: #FFFFFF;
      border-radius: 50%;
      box-shadow: 0 0 4px rgba(255, 255, 255, 0.5);
    }

    .retour-carte {
    position: absolute;

    top: 57px;
    left: 22px;

    width: 42px;
    height: 48px;

    padding: 0;

    border: 0;
    background: transparent;

    color: white;

    font-size: 42px;
    line-height: 45px;

    cursor: pointer;

    z-index: 20;

    -webkit-tap-highlight-color: transparent;
    -webkit-touch-callout: none;
    user-select: none;
}

.retour-carte:focus,
.retour-carte:active {
    outline: none;
    background: transparent;
}
    
.maplibregl-popup-content {
    background: #071416;
    color: white;
    border: 1px solid #19cbbb;
    border-radius: 10px;
    padding: 8px 12px;
    font-family: Arial, sans-serif;
    font-size: 14px;
}

.maplibregl-popup-tip {
    border-top-color: #071416;
}
    
  </style>
</head>
<body>

<button class="retour-carte" onclick="window.location.href='index.html'">‹</button>
<div id="map"></div>

<script>
  // Vos destinations
  const trips = [
    { city: "Londres", coords: [-0.1278, 51.5074] },
    { city: "Split", coords: [16.4402, 43.5081] },
    { city: "Koutouloufari", coords: [25.3927, 35.3061] },
    { city: "Marrakech", coords: [-7.9811, 31.6295] },
    { city: "Tivat", coords: [18.6946, 42.4338] },
    { city: "Fornells", coords: [4.1239, 40.0485] },
    { city: "Golem", coords: [19.5201, 41.2536] },
    { city: "Cascais", coords: [-9.4194, 38.6979] }
  ];

  const style = {
    "version": 8,
    "sources": {
      "countries": {
        "type": "geojson",
        "data": "https://raw.githubusercontent.com/johan/world.geo.json/master/countries.geo.json"
      }
    },
    "layers": [
  {
    "id": "background",
    "type": "background",
    "paint": {
      "background-color": "#071416",
      "background-opacity": 0
    }
  },
  {
    "id": "all-countries",
    "type": "fill",
    "source": "countries",
    "paint": {
      "fill-color": "#176F5A",
      "fill-opacity": 0.85
    }
  },
  {
    "id": "borders",
    "type": "line",
    "source": "countries",
    "paint": {
      "line-color": "#FFFFFF",
      "line-width": 0.4,
      "line-opacity": 0.4
    }
  }
]
  };
      
  const map = new maplibregl.Map({
    container: 'map',
    style: style,
    center: [4, 42],
    zoom: 1.8
  });

  map.on('load', () => setTimeout(startAnimation, 800));

  async function startAnimation() {
    map.flyTo({ center: [4, 42], zoom: 2.8, speed: 0.6, essential: true });

    for (const trip of trips) {
      await new Promise(resolve => setTimeout(resolve, 800));
      const el = document.createElement('div');
      el.className = 'custom-marker';
      const marker = new maplibregl.Marker({ element: el })
    .setLngLat(trip.coords)
    .addTo(map);

marker.setPopup(
    new maplibregl.Popup({
        offset: 10,
        closeButton: false
    }).setText(trip.city)
);

marker.getElement().addEventListener("click", () => {
    marker.togglePopup();
});
    }
  }
</script>

</body>
</html>
